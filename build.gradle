plugins {
    id 'java'
    id 'checkstyle'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'com.gradleup.shadow' version '9.5.1'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    mavenCentral()
}

javafx {
    version = '25.0.2'
    modules = ['javafx.controls']
}

checkstyle {
    toolVersion = '14.1.0'
    maxWarnings = 0
}

tasks.withType(Checkstyle).configureEach {
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.withType(JavaCompile).configureEach {
    // Preserve source and test text regardless of the build machine's default encoding.
    options.encoding = 'UTF-8'
}

dependencies {
    String jUnitVersion = '5.14.4'

    testImplementation "org.junit.jupiter:junit-jupiter-api:${jUnitVersion}"

    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${jUnitVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.14.4'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()

    // Keep month names deterministic in date-display assertions on all machines.
    systemProperty 'user.language', 'en'
    systemProperty 'user.country', 'US'
    systemProperty 'javafx.cachedir', layout.buildDirectory.dir('javafx-cache').get().asFile.absolutePath
    jvmArgs '--enable-native-access=ALL-UNNAMED'

    testLogging {
        events 'passed', 'skipped', 'failed'

        showExceptions = true
        exceptionFormat = 'full'
        showCauses = true
        showStackTraces = true
        showStandardStreams = false
    }
}

application {
    mainClass = 'mary.Launcher'
    applicationDefaultJvmArgs = ['--enable-native-access=ALL-UNNAMED']
}

test {
    useJUnitPlatform { excludeTags 'gui' }
}

tasks.register('guiTest', Test) {
    group = 'verification'
    failFast = true
    description = 'Run JavaFX interaction tests (requires a graphical desktop).'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'gui' }
    systemProperty 'mary.guiSnapshot', layout.buildDirectory.file('reports/gui/mary.png').get().asFile.absolutePath
    shouldRunAfter test
}

jar {
    // A lean JAR file (i.e., without the dependencies packaged inside) is not needed.
    enabled = false
    // Rename its output anyway; Gradle forbids it clashing with the shadowJar output file, even for a disabled task.
    archiveClassifier = 'without-dependencies'
}

shadowJar {
    // Bundles main classes and runtime dependencies; the application plugin supplies Main-Class.
    // Test dependencies (such as JUnit) are not included.
    archiveFileName = 'mary.jar'
}

run {
    standardInput = System.in
}

